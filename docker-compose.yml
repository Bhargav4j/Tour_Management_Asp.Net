version: '3.8'

services:
  tourmanagement-web:
    image: tourmanagement-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tourmanagement-web
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DB_SERVER=${DB_SERVER:-sqlserver}
      - DB_NAME=${DB_NAME:-TourManagementDb}
      - DB_USER=${DB_USER:-sa}
      - DB_PASSWORD=${DB_PASSWORD:-YourStrong@Passw0rd}
      - ConnectionStrings__Redis=${REDIS_CONNECTION:-}
      - TZ=UTC
    volumes:
      - ./logs:/app/logs
      - ./appsettings:/app/appsettings:ro
    networks:
      - tourmanagement-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  tourmanagement-network:
    driver: bridge